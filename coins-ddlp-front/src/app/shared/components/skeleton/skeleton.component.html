@if (announce()) {
  <span class="sr-only" role="status">{{ literals().loading }}</span>
}
@for (_ of items(); track $index) {
  <p-skeleton
    [class.skeleton-circle]="isCircle()"
    [shape]="isCircle() ? 'circle' : 'rectangle'"
    [height]="blockHeight()"
    [width]="width()"
    [borderRadius]="borderRadius()"
  />
}
