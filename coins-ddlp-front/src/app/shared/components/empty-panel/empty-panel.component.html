<div class="empty-panel empty-panel--{{ tone() }}" [attr.role]="role()">
  <span class="empty-panel__icon" aria-hidden="true"><i class="pi {{ icon() }}"></i></span>
  <p class="empty-panel__title">{{ title() }}</p>
  @if (message()) {
    <p class="empty-panel__message">{{ message() }}</p>
  }
  @if (actionLabel()) {
    <app-button
      [label]="actionLabel()"
      [icon]="actionIcon()"
      [variant]="tone() === 'error' ? 'primary' : 'secondary'"
      (clicked)="action.emit()"
    />
  }
</div>
