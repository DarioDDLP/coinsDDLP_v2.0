@if (label()) {
  <label class="field-label" [for]="id">{{ label() }}</label>
}
<input
  class="field-control"
  [id]="id"
  [type]="type()"
  [value]="value()"
  [placeholder]="placeholder()"
  [autocomplete]="autocomplete()"
  [disabled]="disabled()"
  [attr.min]="min()"
  [attr.max]="max()"
  [attr.inputmode]="type() === 'number' ? 'numeric' : null"
  (input)="onInput($event)"
  (keydown.enter)="onEnter()"
/>
