<app-dialog
  [(visible)]="visible"
  [header]="header()"
  [closable]="!loading()"
  [dismissable]="!loading()"
>
  <p class="confirm-dialog__message">{{ message() }}</p>

  <ng-container dialog-footer>
    <app-button
      [label]="literals().cancel"
      variant="secondary"
      [disabled]="loading()"
      (clicked)="visible.set(false)"
    />
    <app-button
      [label]="confirmText()"
      variant="danger"
      [loading]="loading()"
      (clicked)="confirmed.emit()"
    />
  </ng-container>
</app-dialog>
