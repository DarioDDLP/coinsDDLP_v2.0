<div class="progress-stat__row">
  <span class="progress-stat__count">
    @if (label()) {
      <span class="progress-stat__label">{{ label() }}</span>
    }
    <span class="progress-stat__owned">{{ owned() | number: '1.0-0' : lang() }}</span>
    <span class="progress-stat__total"> / {{ total() | number: '1.0-0' : lang() }}</span>
  </span>
  <span class="progress-stat__percent">{{ percent() }} %</span>
</div>
<div
  class="progress-stat__bar"
  role="progressbar"
  [attr.aria-valuenow]="percent()"
  aria-valuemin="0"
  aria-valuemax="100"
  [attr.aria-label]="ariaLabel()"
>
  <span [style.width.%]="percent()"></span>
</div>
@if (breakdown().length > 0) {
  <ul class="progress-stat__breakdown">
    @for (item of breakdown(); track $index) {
      <li
        class="progress-stat__breakdown-item"
        [class.progress-stat__breakdown-item--compare]="$index > 0"
      >
        <span class="progress-stat__breakdown-name">{{ item.label }}</span>
        <span class="progress-stat__breakdown-owned">{{
          item.owned | number: '1.0-0' : lang()
        }}</span>
      </li>
    }
  </ul>
}
