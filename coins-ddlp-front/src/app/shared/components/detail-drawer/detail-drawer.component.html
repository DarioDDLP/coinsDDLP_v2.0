<div
  class="drawer-backdrop"
  [class.drawer-backdrop--leaving]="!open()"
  (click)="requestClose()"
></div>

<p-drawer
  [visible]="open()"
  (visibleChange)="open.set($event)"
  (onHide)="requestClose()"
  position="right"
  appendTo="body"
  styleClass="detail-drawer"
  [modal]="false"
  [closeOnEscape]="true"
>
  <ng-template #headless>
    <div class="drawer" [attr.aria-label]="ariaLabel() || title()">
      <header class="drawer__header">
        <div class="drawer__titles">
          @if (title()) {
            @if (overline()) {
              <span class="drawer__overline">
                <ng-content select="[drawer-overline]" />
                {{ overline() }}
              </span>
            }
            <h2 class="drawer__title">{{ title() }}</h2>
            @if (subtitle()) {
              <p class="drawer__subtitle">{{ subtitle() }}</p>
            }
          } @else {
            <app-skeleton width="8rem" height="0.9rem" radius="sm" [announce]="false" />
            <app-skeleton width="12rem" height="1.6rem" radius="sm" [announce]="false" />
          }
        </div>
        <app-button
          icon="pi pi-times"
          variant="ghost"
          [tooltip]="literals().close"
          (clicked)="requestClose()"
        />
      </header>

      <div class="drawer__body">
        @if (loading()) {
          <div class="drawer-skeleton__badges">
            <app-skeleton
              layout="inline"
              [count]="2"
              width="5.5rem"
              height="28px"
              radius="full"
              [announce]="false"
            />
          </div>
          <div class="drawer-skeleton__images">
            @for (_ of [1, 2]; track $index) {
              <div class="drawer-skeleton__image">
                <app-skeleton layout="inline" shape="circle" [announce]="false" />
                <app-skeleton
                  layout="inline"
                  width="3.5rem"
                  height="0.75rem"
                  radius="sm"
                  [announce]="false"
                />
              </div>
            }
          </div>
          <div class="drawer-skeleton__section">
            <app-skeleton width="7rem" height="0.75rem" radius="sm" [announce]="false" />
            <app-skeleton [count]="6" height="1.5rem" radius="sm" />
          </div>
        } @else {
          <ng-content />
        }
      </div>

      <footer class="drawer__footer">
        <ng-content select="[drawer-footer]" />
      </footer>
    </div>
  </ng-template>
</p-drawer>
