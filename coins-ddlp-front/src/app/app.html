<a class="skip-link" href="#main">{{ literals.skipToContent }}</a>

<p-toast [position]="layout.isMobile() ? 'top-center' : 'top-right'" />

@if (loadingService.isLoading()) {
  <app-loading-spinner />
}

<div class="shell" [class.shell--mobile]="layout.isMobile()">
  @if (layout.isMobile()) {
    <app-topbar />
  } @else {
    <app-sidebar />
  }

  <main class="shell__main" id="main" tabindex="-1">
    <router-outlet />
  </main>
</div>

@if (layout.isMobile()) {
  <app-bottom-nav />
  @defer (when layout.moreOpen()) {
    <app-more-sheet />
  }
}

@defer (when layout.authDialog() !== null) {
  <app-login-dialog
    [visible]="layout.authDialog() !== null"
    [mode]="layout.authDialog() ?? 'login'"
    (closed)="layout.closeAuthDialog()"
  />
}

@defer (when authService.isRecoveryMode()) {
  <app-recovery-password-dialog
    [visible]="authService.isRecoveryMode()"
    (closed)="authService.isRecoveryMode.set(false)"
  />
}
