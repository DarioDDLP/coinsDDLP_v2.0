<app-dialog [(visible)]="visible" [header]="dialogTitle()" size="lg" (hidden)="onHidden()">
  <!-- Un solo elemento por bloque @if: así se proyecta en su hueco de la cabecera -->
  @if (coin(); as c) {
    <app-country-flag dialog-header-start [country]="c.country" [size]="20" />
  }
  @if (coin()?.variant; as variant) {
    <app-badge dialog-header-end [label]="variant" severity="secondary" />
  }

  <div class="uds-form">
    @if (showOwnerPicker()) {
      <div class="uds-form__owner-picker">
        <span class="uds-form__owner-label">{{ literals.editingFor }}</span>
        <app-filter-pills
          [options]="ownerPickerOptions"
          [value]="editingOwner()"
          (valueChange)="onOwnerPickerChange($event)"
        />
      </div>
    }

    <div class="uds-form__row">
      <app-text-input
        [label]="literals.unitsLabel"
        [value]="uds().toString()"
        type="number"
        [min]="0"
        (valueChange)="uds.set(+$event)"
      />

      <app-select
        [label]="literals.conservationLabel"
        [value]="conservation()"
        [options]="conservationOptions"
        (valueChange)="conservation.set($any($event))"
      />
    </div>

    <app-textarea
      [label]="literals.descriptionLabel"
      [value]="description()"
      (valueChange)="description.set($event)"
    />

    <app-textarea
      [label]="literals.observationsLabel"
      [value]="observations()"
      [placeholder]="literals.observationsPlaceholder"
      (valueChange)="observations.set($event)"
    />

    <app-toggle
      [label]="literals.circulationLabel"
      [value]="circulation()"
      (valueChange)="circulation.set($event)"
    />

    <app-text-input
      [label]="literals.idNumLabel"
      [value]="idNum()"
      type="text"
      (valueChange)="idNum.set($event)"
    />
  </div>

  <ng-container dialog-footer>
    <app-button
      [label]="sharedLiterals.cancel"
      variant="secondary"
      (clicked)="visible.set(false)"
    />
    <app-button [label]="sharedLiterals.save" [loading]="loading()" (clicked)="onSubmit()" />
  </ng-container>
</app-dialog>
