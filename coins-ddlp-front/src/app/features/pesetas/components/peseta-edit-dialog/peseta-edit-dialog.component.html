<app-dialog [(visible)]="visible" [header]="dialogTitle()">
  <div class="edit-form">
    <div class="edit-form__row">
      <app-text-input
        [label]="literals.unitsLabel"
        [value]="uds().toString()"
        type="number"
        [min]="0"
        (valueChange)="uds.set(+$event)"
      />

      <app-select
        [label]="literals.conservationLabel"
        [value]="conservation()"
        [options]="availableConservationOptions()"
        [placeholder]="literals.conservationPlaceholder"
        [disabled]="isConservationLocked()"
        (valueChange)="conservation.set($event)"
      />
    </div>

    <app-textarea
      [label]="literals.observationsLabel"
      [value]="observations()"
      [placeholder]="literals.observationsPlaceholder"
      (valueChange)="observations.set($event)"
    />
  </div>

  <ng-container dialog-footer>
    <app-button
      [label]="sharedLiterals.cancel"
      variant="secondary"
      (clicked)="visible.set(false)"
    />
    <app-button [label]="sharedLiterals.save" [loading]="loading()" (clicked)="onSubmit()" />
  </ng-container>
</app-dialog>
