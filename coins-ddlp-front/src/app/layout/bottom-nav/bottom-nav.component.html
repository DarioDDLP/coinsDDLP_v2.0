<nav class="bottom-nav" [attr.aria-label]="literals().mainNav">
  @for (item of items(); track item.routerLink) {
    <a
      class="bottom-nav__tab"
      [routerLink]="item.routerLink"
      routerLinkActive="bottom-nav__tab--active"
      #rla="routerLinkActive"
      [attr.aria-current]="rla.isActive ? 'page' : null"
    >
      <i [class]="item.icon" aria-hidden="true"></i>
      <span>{{ literals()[item.shortLabelKey ?? item.labelKey] }}</span>
    </a>
  }
  <button
    type="button"
    class="bottom-nav__tab"
    [class.bottom-nav__tab--active]="moreActive()"
    [attr.aria-expanded]="layout.moreOpen()"
    aria-haspopup="dialog"
    (click)="layout.moreOpen.set(true)"
  >
    <i class="pi pi-ellipsis-h" aria-hidden="true"></i>
    <span>{{ literals().more }}</span>
  </button>
</nav>
