<header class="topbar">
  @if (header()?.backLink; as backLink) {
    <a
      class="topbar__icon-btn"
      [routerLink]="backLink"
      [queryParams]="header()?.backQueryParams ?? null"
      [attr.aria-label]="literals.back"
    >
      <i class="pi pi-chevron-left" aria-hidden="true"></i>
    </a>
  } @else {
    <a class="topbar__mark" routerLink="/euros" [attr.aria-label]="literals.brandHome">&lt;/&gt;</a>
  }

  @if (header()?.country; as country) {
    <app-country-flag [country]="country" [size]="28" />
  }
  <h1 class="topbar__title">{{ title() }}</h1>

  @if (authService.isLoggedIn()) {
    <button
      type="button"
      class="topbar__avatar"
      [attr.aria-label]="literals.account"
      (click)="layout.moreOpen.set(true)"
    >
      {{ initials() }}
    </button>
  } @else {
    <button
      type="button"
      class="topbar__icon-btn"
      [attr.aria-label]="authLiterals.loginTitle"
      (click)="layout.openLogin()"
    >
      <i class="pi pi-sign-in" aria-hidden="true"></i>
    </button>
  }
</header>
