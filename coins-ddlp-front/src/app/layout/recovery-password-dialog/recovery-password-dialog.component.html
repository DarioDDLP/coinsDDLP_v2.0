<app-dialog
  [(visible)]="visible"
  [header]="header()"
  size="sm"
  [closable]="isChange()"
  (hidden)="onHidden()"
>
  <div class="recovery-form">
    <app-text-input
      [label]="literals().newPasswordLabel"
      [value]="newPassword()"
      type="password"
      [placeholder]="literals().newPasswordPlaceholder"
      autocomplete="new-password"
      (valueChange)="newPassword.set($event)"
    />

    <app-text-input
      [label]="literals().confirmPasswordLabel"
      [value]="confirmPassword()"
      type="password"
      [placeholder]="literals().confirmPasswordPlaceholder"
      autocomplete="new-password"
      (valueChange)="confirmPassword.set($event)"
      (enterPressed)="onSubmit()"
    />

    @if (errorMessage()) {
      <p class="recovery-form__error" role="alert">{{ errorMessage() }}</p>
    }
  </div>

  <ng-container dialog-footer>
    @if (isChange()) {
      <app-button
        [label]="sharedLiterals().cancel"
        variant="secondary"
        (clicked)="visible.set(false)"
      />
    }
    <app-button
      [label]="literals().recoveryButton"
      [loading]="loading()"
      [disabled]="!newPassword() || !confirmPassword()"
      (clicked)="onSubmit()"
    />
  </ng-container>
</app-dialog>
